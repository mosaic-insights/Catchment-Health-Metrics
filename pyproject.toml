[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "catchment-health-metrics"
version = "0.1.0"
description = "Catchment Health Metrics: Python tools for terrain, vegetation, connectivity, erosion, hydroclimate, and risk analysis"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.12"
license = { text = "MIT License" }
authors = [{ name = "Jabbar Khaledi", email = "jabbarkhaledi88@gmail.com" }]
keywords = ["catchment health", "risk profile", "RUSLE", "vegetation", "terrain"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
  # Core scientific stack
  "numpy>=1.24,<2.4",
  "pandas>=2.0,<3.0",
  "scipy>=1.11,<2.0",
  "matplotlib>=3.8,<3.9",
  "tqdm>=4.66",
  "requests>=2.31",
  "pyyaml>=6.0",
  "pydantic>=2.5,<3.0",
  "typer>=0.12.3,<1.0",

  # Xarray / NetCDF stack
  "xarray>=2024.6,<2027.0",
  "dask>=2024.6",
  "netCDF4>=1.6",
  "h5netcdf>=1.3",
  "h5py>=3.10",

  # Geospatial stack
  "rasterio>=1.3,<1.5",
  "rioxarray>=0.18,<0.23",
  "geopandas>=1.0,<1.2",
  "shapely>=2.0,<3.0",
  "pyproj>=3.6,<4.0",
  "fiona>=1.9,<1.11",
  "pyogrio>=0.7",
  "affine>=2.4",
  "rasterstats>=0.19",
  "contextily>=1.5",

  # STAC / Open Data Cube stack
  "pystac>=1.10,<2.0",
  "pystac-client>=0.9,<1.0",
  "odc-stac>=0.5.2,<0.6",
  "odc-loader>=0.6.4,<0.7",
  "odc-geo>=0.5.1,<0.6",

  # Hydrology / terrain
  "pysheds>=0.5,<0.6",
  "standard-precip",

  # Documents / spreadsheets
  "openpyxl>=3.1",
  "python-docx>=1.1.2,<1.2",
  "lxml>=5.3,<6",
  "pillow>=10.4,<11",
  "ipykernel>=6.29",
  "jupyterlab>=4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pre-commit>=3.6",
  "ruff>=0.5.1",
]

[project.urls]
Homepage = "https://github.com/mosaic-insights/Catchment-Health-Metrics"

[project.scripts]
catchment-health-metrics = "chm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chm"]

[tool.hatch.build.targets.wheel.force-include]
"src/chm/py.typed" = "chm/py.typed"

[tool.hatch.build.targets.sdist]
include = ["src/**", "README.md", "LICENSE", "pyproject.toml"]