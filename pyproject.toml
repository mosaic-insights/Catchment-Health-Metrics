[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "catchment-health-metrics"
version = "0.1.0"
description = "Catchment Health Metrics: Python tools for terrain, vegetation, connectivity, erosion, hydroclimate, and risk analysis"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT License" }
authors = [{ name = "Jabbar Khaledi", email = "jabbarkhaledi88@gmail.com" }]
keywords = ["catchment health", "risk profile", "RUSLE", "vegetation", "terrain"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xarray>=2023.12.0",
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "affine>=2.4",
  "tqdm>=4.66",
  "requests>=2.31",
  "typer>=0.12.3",
  "pydantic>=2.5",
  "pystac-client>=0.7",
  "odc-stac>=0.3",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "pysheds>=0.3",
  "pyyaml>=6.0",
  "rasterstats>=0.19",
  "python-docx>=1.1.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "pre-commit>=3.6", "ruff>=0.5.1"]

[project.urls]
Homepage = "https://github.com/mosaic-insights/Catchment-Health-Metrics"

# Console script: requires src/chm/cli.py defining `app = typer.Typer()`
[project.scripts]
catchment-health-metrics = "chm.cli:app"

# Tell Hatchling where to find packages
[tool.hatch.build.targets.wheel]
packages = ["src/chm"]

[tool.hatch.build.targets.wheel.force-include]
"src/chm/py.typed" = "chm/py.typed"

[tool.hatch.build.targets.sdist]
include = ["src/**", "README.md", "LICENSE", "pyproject.toml"]